name: Build Plugins

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin to build
        required: true
        default: all
        type: choice
        options:
          - all
          - StatusDurations

jobs:
  build:
    name: Build ${{ github.event.inputs.plugin || 'all' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare release folder
        run: |
          rm -rf releases
          mkdir releases

      - name: Build selected plugin
        run: node scripts/build-selected.js "${{ inputs.plugin }}"

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: betterdiscord-plugins-${{ inputs.plugin }}
          path: releases/*.plugin.js
          if-no-files-found: error
